services:

  postgres:
    image: postgres:16
    container_name: aspmanager-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices-network

  aspmanager-service-discovery:
    build:
      context: ../aspmanager-service-discovery
    image: aspmanager-service-discovery:latest
    container_name: aspmanager-service-discovery
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - microservices-network

  aspmanager-gateway:
    build:
      context: ../aspmanager-gateway
    image: aspmanager-gateway:latest
    container_name: aspmanager-gateway
    ports:
      - "8080:8080"
    depends_on:
      aspmanager-service-discovery:
        condition: service_healthy
    environment:
      EUREKA_URL: ${EUREKA_URL}
    networks:
      - microservices-network

  aspmanager-auth-service:
    build:
      context: ../aspmanager-auth-service
    image: aspmanager-auth-service:latest
    depends_on:
      aspmanager-service-discovery:
        condition: service_healthy
    environment:
      EUREKA_URL: ${EUREKA_URL}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - microservices-network

  aspmanager-usuario-service:
    build:
      context: ../aspmanager-usuario-service
    image: aspmanager-usuario-service:latest
    depends_on:
      postgres:
        condition: service_started
      aspmanager-service-discovery:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}db_usuario
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      EUREKA_URL: ${EUREKA_URL}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}
    networks:
      - microservices-network

  aspmanager-escola-service:
    build:
      context: ../aspmanager-escola-service
    image: aspmanager-escola-service:latest
    depends_on:
      - postgres
      - aspmanager-service-discovery
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}db_escola
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      EUREKA_URL: ${EUREKA_URL}
    networks:
      - microservices-network

  aspmanager-espaco-service:
    build:
      context: ../aspmanager-espaco-service
    image: aspmanager-espaco-service:latest
    depends_on:
      - postgres
      - aspmanager-service-discovery
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}db_espaco
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      EUREKA_URL: ${EUREKA_URL}
    networks:
      - microservices-network

  aspmanager-software-service:
    build:
      context: ../aspmanager-software-service
    image: aspmanager-software-service:latest
    depends_on:
      postgres:
        condition: service_started
      aspmanager-service-discovery:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}db_software
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      EUREKA_URL: ${EUREKA_URL}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}
    networks:
      - microservices-network

volumes:
  postgres_data:

networks:
  microservices-network:
    driver: bridge